<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication</title>
  <link rel="stylesheet" href="styleN.css">
</head>
<body>

  <div class="auth-card">
    <h2 id="form-title">Sign In</h2>
    
    <form id="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btn-submit" class="btn-primary">Sign In</button>
    </form>

    <div class="toggle-text toggle-box">
      <p id="toggle-text">Don't have an account? <a href="#" id="toggle-link">Sign Up</a></p>
    </div>

    <p id="msg-box" class="error-message"></p>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
