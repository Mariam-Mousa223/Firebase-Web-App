<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - My Tasks</title>
  <link rel="stylesheet" href="styleN.css">
</head>
<body>

  <div class="dashboard-card">
    <div class="header-row">
      <h2>My Tasks</h2>
      <button id="logout-btn" class="btn-logout">Logout</button>
    </div>

    <form id="task-form">
      <div class="form-group">
        <label>Task Title</label>
        <input type="text" id="task-title" placeholder="Enter task title..." required>
      </div>

      <div class="form-group">
        <label>Task Details (optional)</label>
        <textarea id="task-desc" rows="3" placeholder="Enter task details..."></textarea>
      </div>

      <button type="submit" id="save-task-btn" class="btn-primary">Add Task</button>
    </form>

    <hr style="margin: 25px 0; border: none; border-top: 1px solid #e2e8f0;">

    <h3 style="color: #2d3748; margin-bottom: 15px;">Tasks List</h3>
    <div id="tasks-container">
      <p style="color: #718096;">Loading tasks...</p>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
